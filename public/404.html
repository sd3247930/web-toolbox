<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>跳转中…</title>
    <script>
      // GitHub Pages 对未知路径返回 404.html：
      // 把当前路径暂存到 sessionStorage，然后回到应用首页，
      // 由 App 读取并恢复路由（保持干净的深链 URL）。
      sessionStorage.setItem('redirect', location.pathname.replace('/web-toolbox', '') + location.search);
      location.replace('/web-toolbox/');
    </script>
  </head>
  <body>
    <p>正在跳转到「四合一工具集」…</p>
  </body>
</html>
